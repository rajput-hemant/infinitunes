[test]
# `mock.module` and a global DOM leak across every file in one bun process, so
# these files stay out of the plain run. `bun run test:isolated`
# (scripts/test-isolated.ts) runs each of them in its own process: every file in
# `apps/web/tests/mocked` and `apps/web/tests/dom`, plus the two trpc router
# tests, which mock `@infinitunes/db` with different fakes.
pathIgnorePatterns = [
  "apps/web/tests/dom/**",
  "apps/web/tests/mocked/**",
  "packages/trpc/tests/history-router.test.ts",
  "packages/trpc/tests/user-router.test.ts",
]
