name: local-platforms

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: local-platforms-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: local_platforms
    volumes:
      - local_platforms_pgdata_18:/var/lib/postgresql
      - ./docker/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d local_platforms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: local-platforms-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - local_platforms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-rest:
    image: hiett/serverless-redis-http:latest
    container_name: local-platforms-redis-rest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8079:80"
    environment:
      SRH_MODE: standalone
      SRH_REDIS_URL: redis://redis:6379
      SRH_TOKEN: localdevtoken
      SRH_CONNECTION_TIMEOUT: 1000
    depends_on:
      redis:
        condition: service_healthy

volumes:
  local_platforms_pgdata_18:
    name: local_platforms_pgdata_18
  local_platforms_redis_data:
    name: local_platforms_redis_data

networks:
  default:
    name: local_platforms_net
