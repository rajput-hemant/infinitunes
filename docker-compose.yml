services:
  postgres:
    image: postgres:18.6-alpine
    container_name: infinitunes-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: local_platforms
    volumes:
      - infinitunes_pgdata_18:/var/lib/postgresql
      - ./docker/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d local_platforms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: infinitunes-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - infinitunes_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-rest:
    image: hiett/serverless-redis-http:latest
    container_name: infinitunes-redis-rest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8079:80"
    environment:
      SRH_MODE: standalone
      SRH_REDIS_URL: redis://redis:6379
      SRH_TOKEN: localdevtoken
      SRH_CONNECTION_TIMEOUT: 1000
    depends_on:
      redis:
        condition: service_healthy

volumes:
  infinitunes_pgdata_18:
  infinitunes_redis_data:
