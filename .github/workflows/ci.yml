name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SKIP_ENV_VALIDATION: true
  DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
  AUTH_SECRET: test-secret-key-that-is-at-least-32-chars-long

jobs:
  checks:
    name: Format, Lint & Types
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up and install
        uses: ./.github/actions/setup

      - name: Check formatting
        run: bun run fmt:check

      - name: Check linting
        run: bun run lint

      - name: Check types
        run: bun run type-check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up and install
        uses: ./.github/actions/setup

      - name: Run tests
        run: bun run test

  production:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up and install
        uses: ./.github/actions/setup

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Build production
        run: bun run build

      - name: Verify static asset startup
        run: |
          cleanup() {
            if [ -n "${SERVER_PID:-}" ]; then
              kill -TERM "$SERVER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT INT TERM

          bun run start &
          SERVER_PID=$!

          READY=0
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "http://127.0.0.1:3000/robots.txt"; then
              echo "Server is ready after $i seconds"
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Server failed to become ready within 30 seconds"
            exit 1
          fi

          echo "Checking static asset /robots.txt"
          ASSET_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/robots.txt")
          echo "Asset status: $ASSET_STATUS"
          [ "$ASSET_STATUS" -eq 200 ]

  build:
    name: Run Type Check, Linters & Tests
    runs-on: ubuntu-latest
    needs: [checks, test, production]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || exit 1
          done

  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commits messages
        uses: wagoid/commitlint-github-action@v6
